<div class="breadcrumb"><a href="/">公差工具站</a><span>›</span>公差反查</div>

<p class="rev-lede">已知上下偏差时，反查 ISO 286 公差带代号；已知间隙或过盈范围时，列出实际间隙落在该范围内的配合。计算与「<a href="/fit/" style="color:#1d4ed8;text-decoration:none">公差配合查询</a>」使用同一套数据（1~500 mm，IT5~IT13）。下面的说明是占位文案，稍后会再润色。</p>

<div class="rev-tabs" role="tablist" aria-label="反查方式">
  <button type="button" class="rev-tab active" role="tab" data-mode="dev" aria-selected="true">按偏差查代号</button>
  <button type="button" class="rev-tab" role="tab" data-mode="fit" aria-selected="false">按间隙 / 过盈查配合</button>
</div>

<div id="panel-dev" class="rev-card" role="tabpanel">
  <form id="devForm">
    <div class="rev-grid">
      <div class="input-group">
        <label for="devDim">基本尺寸 (mm)</label>
        <input type="number" id="devDim" value="25" min="1" max="500" step="any" required>
      </div>
      <div class="input-group">
        <label>孔 / 轴</label>
        <div class="rev-kind">
          <label><input type="radio" name="kind" value="hole" checked> 孔</label>
          <label><input type="radio" name="kind" value="shaft"> 轴</label>
        </div>
      </div>
      <div class="input-group">
        <label for="devUpper">上偏差</label>
        <input type="number" id="devUpper" value="0.021" step="any" required>
      </div>
      <div class="input-group">
        <label for="devLower">下偏差</label>
        <input type="number" id="devLower" value="0" step="any" required>
      </div>
      <div class="input-group">
        <label for="devUnit">偏差单位</label>
        <select id="devUnit">
          <option value="mm" selected>mm</option>
          <option value="um">μm</option>
        </select>
      </div>
    </div>
    <div class="rev-actions"><button type="submit">反查代号</button></div>
    <div class="rev-examples">
      <button type="button" data-example="h7">示例：Ø25 孔 +0.021 / 0 mm</button>
      <button type="button" data-example="g6">示例：Ø50 轴 g6 偏差</button>
      <button type="button" data-example="close">示例：Ø25 孔 +0.020 / 0 mm（无精确匹配）</button>
    </div>
  </form>
  <div id="devResult" style="margin-top:16px"></div>
</div>

<div id="panel-fit" class="rev-card" role="tabpanel" hidden>
  <form id="fitForm">
    <p class="rev-note" style="margin:0 0 12px">最小 / 最大间隙均指孔相对轴的间隙；过盈请填负值。只有实际最小间隙和最大间隙都落在该区间内的配合才会列出。</p>
    <div class="rev-grid">
      <div class="input-group">
        <label for="fitDim">基本尺寸 (mm)</label>
        <input type="number" id="fitDim" value="25" min="1" max="500" step="any" required>
      </div>
      <div class="input-group">
        <label for="fitMin">最小间隙（过盈用负值）</label>
        <input type="number" id="fitMin" value="0.020" step="any" required>
      </div>
      <div class="input-group">
        <label for="fitMax">最大间隙（过盈用负值）</label>
        <input type="number" id="fitMax" value="0.070" step="any" required>
      </div>
      <div class="input-group">
        <label for="fitUnit">间隙单位</label>
        <select id="fitUnit">
          <option value="mm" selected>mm</option>
          <option value="um">μm</option>
        </select>
      </div>
    </div>
    <div class="rev-actions"><button type="submit">查找配合</button></div>
    <div class="rev-examples">
      <button type="button" data-example="inter">示例：Ø30，过盈 −0.050 ~ −0.010 mm</button>
      <button type="button" data-example="clr">示例：Ø25，间隙 0.020 ~ 0.070 mm</button>
    </div>
  </form>
  <div id="fitResult" style="margin-top:16px"></div>
</div>
